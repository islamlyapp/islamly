name: Islamly Production Node

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm install
      
    - name: Build Scholarly Node
      run: npm run build
      env:
        NEXT_PUBLIC_HADITH_API_KEY: ${{ secrets.NEXT_PUBLIC_HADITH_API_KEY }}
        GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
